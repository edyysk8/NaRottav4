services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: narotta
      POSTGRES_USER: narotta
      POSTGRES_PASSWORD: narotta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
