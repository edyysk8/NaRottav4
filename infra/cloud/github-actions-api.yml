name: deploy-api
on:
  push:
    branches: [ main ]
    paths:
      - 'apps/backend/**'
      - 'infra/cloud/Dockerfile.api'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/cloud/Dockerfile.api
          push: false
