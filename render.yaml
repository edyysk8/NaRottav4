services:
  - type: web
    name: narotta-api
    env: node
    plan: free
    rootDir: apps/backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: narotta-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: narotta-redis
          property: connectionString
  - type: web
    name: narotta-admin
    env: node
    plan: free
    rootDir: apps/admin
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

databases:
  - name: narotta-db
    plan: free
